baseURL: "https://hugo-dead-simple.netlify.com/"
defaultContentLanguage: "zh-cn"
title: "Rainboy's Blog"
enableGitInfo: false
theme: ["hugo-admonitions", "hugo-dead-simple"]
uglyURLs: true
menu:
  main:
    - name: "<u>H</u>ome"
      url: /
      weight: 1
    - name: "<u>T</u>ags"
      url: "/tags"
      weight: 3

params:
  description: "Rainboy's Blog"
  author: "Rainboy"
  timeZone: "Asia/Shanghai" # 设置时区,footer 格式化时间的时候使用
  recent_post_count: 10 # 最近提交文章列表的数量
  hideRSS: true
  hideCredits: true
  hideCopyright: true
  noSearch: false
  mail: "rainboylvx@qq.com"
  friends:
    - name: "🏗️Rainboy's work"
      url: "https://idx.roj.ac.cn"
  # 下面的文件放到 static 里面
  links:
    - rel: "stylesheet"
      href: "/grid.css"

frontmatter:
  lastmod: # 使用文件的最后修改时间作为 lastmod
    - lastmod
    - :fileModTime

markup:
  goldmark:
    renderer:
      unsafe: true # Allow raw HTML in markdown
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
  highlight:
    codeFences: true
    style: gruvbox
    lineNumbersInTable: false
    noClasses: false
    guessSyntax: true
    lineNos: true
    tabWidth: 4

# 学习笔记的示例代码只用于 {{< include >}} 读取（readFile 绕过页面管线），
# 不需要也不应该发布到 public/。
ignoreFiles:
  - "content/typescript/src/.*"
  - "content/typescript/_archive/src/.*"

outputs:
  home:
    - html
    - rss
    - json
  page:
    - html