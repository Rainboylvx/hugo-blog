<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
<title id="title">一个应用任务拥有模式和亮度</title><desc id="desc">KEY 必须保留；TICK 可合并。呼吸相位按实际时间计算。</desc>
<rect width="960" height="270" rx="20" fill="#f1f5f9"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="36" y="48" font-size="25" font-weight="bold">一个应用任务拥有模式和亮度</text>
<rect x="30" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="132" y="136" text-anchor="middle" font-size="18">BOOT → KEY 事件</text>
<text x="244" y="136" font-size="24">→</text>
<rect x="265" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="367" y="136" text-anchor="middle" font-size="18">定时 → TICK 事件</text>
<text x="479" y="136" font-size="24">→</text>
<rect x="500" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="602" y="136" text-anchor="middle" font-size="18">队列 → 状态机</text>
<text x="714" y="136" font-size="24">→</text>
<rect x="735" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="837" y="136" text-anchor="middle" font-size="18">亮度 → PWM BSP</text>
<text x="36" y="222" font-size="19">KEY 必须保留；TICK 可合并。呼吸相位按实际时间计算。</text></g></svg>
