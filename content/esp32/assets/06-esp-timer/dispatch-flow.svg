<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">ESP Timer 默认任务派发流程</title>
  <desc id="desc">底层定时中断唤醒 esp_timer 任务，esp_timer 任务串行执行短回调，回调通过任务通知唤醒 LED 任务完成 GPIO 和日志操作。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1440" height="650" rx="28" fill="#f8fafc"/>
  <text x="720" y="62" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#0f172a">默认 ESP_TIMER_TASK 派发流程</text>
  <text x="720" y="101" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#475569">到期时刻只是触发起点，业务代码在普通任务中完成</text>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="270" height="230" rx="22" fill="#fff" stroke="#0891b2" stroke-width="3"/>
    <rect x="415" y="185" width="270" height="230" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
    <rect x="760" y="185" width="270" height="230" rx="22" fill="#fff" stroke="#2563eb" stroke-width="3"/>
    <rect x="1105" y="185" width="270" height="230" rx="22" fill="#fff" stroke="#16a34a" stroke-width="3"/>
  </g>

  <circle cx="205" cy="250" r="39" fill="#cffafe"/>
  <text x="205" y="258" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0e7490">时钟</text>
  <text x="205" y="325" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">底层定时中断</text>
  <text x="205" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">发现定时器到期</text>

  <circle cx="550" cy="250" r="39" fill="#ede9fe"/>
  <text x="550" y="258" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#6d28d9">TASK</text>
  <text x="550" y="325" text-anchor="middle" font-family="monospace" font-size="23" font-weight="700" fill="#0f172a">esp_timer task</text>
  <text x="550" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">串行派发所有回调</text>

  <circle cx="895" cy="250" r="39" fill="#dbeafe"/>
  <text x="895" y="258" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">CB</text>
  <text x="895" y="325" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">短回调</text>
  <text x="895" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">只发送任务通知</text>

  <circle cx="1240" cy="250" r="39" fill="#dcfce7"/>
  <text x="1240" y="258" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#15803d">LED</text>
  <text x="1240" y="325" text-anchor="middle" font-family="monospace" font-size="23" font-weight="700" fill="#0f172a">led_task</text>
  <text x="1240" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">GPIO + 日志 + 业务</text>

  <line x1="340" y1="285" x2="415" y2="285" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="685" y1="285" x2="760" y2="285" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1030" y1="285" x2="1105" y2="285" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="125" y="500" width="1190" height="84" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="720" y="535" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#9a3412">为什么回调必须短</text>
  <text x="720" y="566" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#7c2d12">默认模式下回调逐个执行；一个回调阻塞、打印大量日志或做重计算，会推迟其他定时器的回调。</text>
</svg>
