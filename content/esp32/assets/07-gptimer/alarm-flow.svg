<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
<title id="title">GPTimer：报警与任务执行是两个时刻</title><desc id="desc">报警周期由硬件维持；任务日志的间隔仍会受到调度影响。</desc>
<rect width="960" height="270" rx="20" fill="#f1f5f9"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="36" y="48" font-size="25" font-weight="bold">GPTimer：报警与任务执行是两个时刻</text>
<rect x="30" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="132" y="136" text-anchor="middle" font-size="18">1 MHz 硬件计数</text>
<text x="244" y="136" font-size="24">→</text>
<rect x="265" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="367" y="136" text-anchor="middle" font-size="18">每秒自动重载</text>
<text x="479" y="136" font-size="24">→</text>
<rect x="500" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="602" y="136" text-anchor="middle" font-size="18">ISR 发送通知</text>
<text x="714" y="136" font-size="24">→</text>
<rect x="735" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="837" y="136" text-anchor="middle" font-size="18">任务翻转 GPIO1</text>
<text x="36" y="222" font-size="19">报警周期由硬件维持；任务日志的间隔仍会受到调度影响。</text></g></svg>
