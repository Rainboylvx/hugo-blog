<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">FreeRTOS 任务从阻塞到运行的过程</title>
  <desc id="desc">LED 任务在队列为空时阻塞；按键任务发送事件后，LED 任务就绪并运行；状态任务在收到通知后就绪并运行。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1440" height="520" rx="28" fill="#f8fafc"/>
  <text x="720" y="58" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#0f172a">阻塞不是卡死，而是在等待条件</text>

  <text x="90" y="151" font-family="monospace" font-size="24" font-weight="700" fill="#0f172a">led_task</text>
  <rect x="280" y="110" width="300" height="70" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="430" y="153" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#075985">Blocked：等待队列</text>
  <line x1="580" y1="145" x2="760" y2="145" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="670" y="122" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">按键事件入队</text>
  <rect x="770" y="110" width="220" height="70" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="880" y="153" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#92400e">Ready：等待调度</text>
  <line x1="990" y1="145" x2="1130" y2="145" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1140" y="110" width="220" height="70" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1250" y="153" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#166534">Running：处理事件</text>

  <text x="90" y="310" font-family="monospace" font-size="24" font-weight="700" fill="#0f172a">status_task</text>
  <rect x="280" y="269" width="300" height="70" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="430" y="312" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#075985">Blocked：等待通知</text>
  <line x1="580" y1="304" x2="760" y2="304" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="670" y="281" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">通知计数加 1</text>
  <rect x="770" y="269" width="220" height="70" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="880" y="312" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#92400e">Ready：等待调度</text>
  <line x1="990" y1="304" x2="1130" y2="304" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1140" y="269" width="220" height="70" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1250" y="312" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#166534">Running：打印统计</text>

  <rect x="160" y="410" width="1120" height="68" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="720" y="452" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#3730a3">Blocked 状态不消耗 CPU；条件满足后先进入 Ready，调度器再选择最高优先级的可运行任务。</text>
</svg>
