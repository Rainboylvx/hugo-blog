<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
<title id="title">LEDC：PWM 载波和亮度包络分别处理</title><desc id="desc">LEDC_FADE_NO_WAIT：渐变期间仍每 10 ms 检查 BOOT。</desc>
<rect width="960" height="270" rx="20" fill="#f1f5f9"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="36" y="48" font-size="25" font-weight="bold">LEDC：PWM 载波和亮度包络分别处理</text>
<rect x="30" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="132" y="136" text-anchor="middle" font-size="18">5 kHz 硬件 PWM</text>
<text x="244" y="136" font-size="24">→</text>
<rect x="265" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="367" y="136" text-anchor="middle" font-size="18">1 秒硬件渐变</text>
<text x="479" y="136" font-size="24">→</text>
<rect x="500" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="602" y="136" text-anchor="middle" font-size="18">完成 ISR 通知</text>
<text x="714" y="136" font-size="24">→</text>
<rect x="735" y="88" width="205" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="837" y="136" text-anchor="middle" font-size="18">任务启动反向渐变</text>
<text x="36" y="222" font-size="19">LEDC_FADE_NO_WAIT：渐变期间仍每 10 ms 检查 BOOT。</text></g></svg>
